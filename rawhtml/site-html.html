<!-- =====================================================================
     АНО «Дирижабль» — сквозной код сайта для Craftum.

     Куда вставлять: «Настройки сайта» → вкладка «HTML» →
     поле «Пользовательский HTML». Один раз на весь сайт, затем
     «Опубликовать все страницы».

     Что внутри: шрифты, весь assets/css/knit.css (заскоупленный под .dzb),
     весь assets/js/app.js и assets/js/articles.js. Разметка страниц сюда
     не входит — она лежит отдельными блоками «HTML-код», см. rawhtml/pages/.

     Аналитики здесь нет: счётчики в Craftum ставятся его собственными
     средствами, в том же поле «Пользовательский HTML».

     Файл собран скриптом tools/make_rawhtml.py. Руками не править:
     правки идут в knit.css / app.js, затем пересборка.
     ===================================================================== -->
<!-- Блоки прячутся до плавного появления только при работающем JS:
     иначе при отключённых скриптах страница осталась бы пустой. -->
<script>document.documentElement.classList.add("dzb-js")</script>

/* --- защита от стилей страницы-хозяина --- */
.dzb :where(h1,h2,h3,h4,h5,h6,p,li,dt,dd,span,a,b,strong,em,i,small,
             figcaption,button,label,time,blockquote,figure,ul,ol,dl) {
  font-family: inherit; font-size: inherit; font-weight: inherit;
  font-style: inherit; line-height: inherit; letter-spacing: normal;
  text-transform: none; text-align: inherit; color: inherit; margin: 0;
}
.dzb :where(ul,ol) { padding: 0; list-style: none; }
.dzb :where(img,svg,video) { border: 0; border-radius: 0; box-shadow: none; }
.dzb :where(button) { margin: 0; padding: 0; background: transparent;
  border: 0; border-radius: 0; box-shadow: none; text-transform: none; }

/* --- assets/css/knit.css, заскоуплен под .dzb --- */



.dzb {
  /* шерсть — фоны */
  --wool-50:  #FBF6EC;
  --wool-100: #F4EADA;
  --wool-200: #EADCC6;
  --wool-300: #DCC8AA;
  --wool-400: #C7AE8C;

  /* чернила — текст */
  --ink:      #33291F;
  --ink-soft: #6B5A47;
  --ink-mute: #927E67;

  /* пряжа — акценты (наследуют фирменные цвета логотипа-дирижабля) */
  --yarn-blue:      #1E93CC;
  --yarn-blue-deep: #146189;
  --yarn-orange:    #EE7B18;
  --yarn-orange-deep:#C25E06;
  --yarn-berry:     #B4436B;
  --yarn-sage:      #6E8F63;
  --yarn-mustard:   #D9A441;

  --accent:      var(--yarn-blue);
  --accent-deep: var(--yarn-blue-deep);

  /* нить-обводка */
  --thread: color-mix(in srgb, var(--ink) 22%, transparent);
  --thread-strong: color-mix(in srgb, var(--ink) 38%, transparent);

  /* геометрия */
  --r-sm: 10px;
  --r-md: 18px;
  --r-lg: 28px;
  --r-xl: 40px;
  --r-pill: 999px;

  /* мягкие «шерстяные» тени — без чёрного, только тёплый коричневый */
  --shadow-1: 0 2px 0 color-mix(in srgb, var(--wool-400) 55%, transparent),
              0 6px 18px -8px color-mix(in srgb, var(--ink) 30%, transparent);
  --shadow-2: 0 3px 0 color-mix(in srgb, var(--wool-400) 65%, transparent),
              0 16px 34px -16px color-mix(in srgb, var(--ink) 38%, transparent);
  --shadow-lift: 0 5px 0 color-mix(in srgb, var(--wool-400) 70%, transparent),
              0 26px 48px -20px color-mix(in srgb, var(--ink) 42%, transparent);

  /* ритм */
  --gap:   clamp(1rem, 3vw, 1.75rem);
  --pad-x: clamp(1rem, 5vw, 2.5rem);
  --section-y: clamp(3rem, 9vw, 6.5rem);
  --maxw: 1140px;
  --maxw-text: 68ch;

  --ease: cubic-bezier(.34, .12, .2, 1);
  --header-h: 68px;
}


.dzb *, .dzb *::before, .dzb *::after { box-sizing: border-box; }

.dzb {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + 1rem);
}

.dzb {
  margin: 0;
  min-height: 100svh;
  background-color: var(--wool-50);
  background-image: url("https://undemorbe.github.io/dirigible_community/assets/img/knit-stockinette.svg");
  background-size: 44px 33px;
  color: var(--ink);
  font-family: "Nunito", "Segoe UI", "Helvetica Neue", system-ui, -apple-system, sans-serif;
  font-size: clamp(1rem, .96rem + .25vw, 1.125rem);
  line-height: 1.65;
  font-weight: 400;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.dzb.is-locked { overflow: hidden; }

.dzb img, .dzb svg, .dzb video { display: block; max-width: 100%; height: auto; }
.dzb img { background-color: var(--wool-100); }

.dzb button, .dzb input, .dzb select, .dzb textarea { font: inherit; color: inherit; }
.dzb button { cursor: pointer; }

.dzb a { color: var(--accent-deep); text-decoration-thickness: 1.5px; text-underline-offset: .22em; }
.dzb a:hover { color: var(--yarn-orange-deep); }


.dzb :focus-visible {
  outline: 3px dashed var(--yarn-orange);
  outline-offset: 3px;
  border-radius: var(--r-sm);
}

.dzb ::selection { background: color-mix(in srgb, var(--yarn-mustard) 45%, transparent); }

.dzb .skip-link {
  position: absolute; left: 50%; top: -100px; transform: translateX(-50%);
  z-index: 200; padding: .75rem 1.25rem;
  background: var(--ink); color: var(--wool-50);
  border-radius: 0 0 var(--r-md) var(--r-md); font-weight: 700;
}
.dzb .skip-link:focus { top: 0; color: var(--wool-50); }

.dzb .visually-hidden {
  position: absolute !important; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}



.dzb .knit-stockinette { background-image: url("https://undemorbe.github.io/dirigible_community/assets/img/knit-stockinette.svg"); background-size: 44px 33px; }

.dzb .knit-seed { background-image: url("https://undemorbe.github.io/dirigible_community/assets/img/knit-seed.svg"); background-size: 30px 30px; }

.dzb .knit-rib {
  background-image:
    repeating-linear-gradient(90deg,
      color-mix(in srgb, var(--ink) 9%, transparent) 0 2px,
      transparent 2px 7px,
      color-mix(in srgb, #fff 60%, transparent) 7px 9px,
      transparent 9px 14px);
}


.dzb .swatch {
  position: relative;
  background-color: var(--wool-100);
  background-image: url("https://undemorbe.github.io/dirigible_community/assets/img/knit-stockinette.svg");
  background-size: 44px 33px;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  overflow: hidden;
}

.dzb .swatch::after {
  content: "";
  position: absolute; inset: 8px;
  border: 2px dashed color-mix(in srgb, var(--ink) 20%, transparent);
  border-radius: calc(var(--r-lg) - 8px);
  pointer-events: none;
}
.dzb .swatch--plain::after { display: none; }


.dzb .cable-divider {
  height: 26px;
  color: var(--yarn-mustard);
  background-image: url("https://undemorbe.github.io/dirigible_community/assets/img/knit-cable.svg");
  background-repeat: repeat-x;
  background-size: auto 26px;
  opacity: .55;
  margin-block: clamp(1.5rem, 5vw, 3rem);
}


.dzb .scallop-bottom { position: relative; }
.dzb .scallop-bottom::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -13px; height: 14px;
  background: inherit;
  -webkit-mask-image: radial-gradient(circle at 13px 0, #000 12px, transparent 12.5px);
          mask-image: radial-gradient(circle at 13px 0, #000 12px, transparent 12.5px);
  -webkit-mask-size: 26px 14px; mask-size: 26px 14px;
  -webkit-mask-repeat: repeat-x; mask-repeat: repeat-x;
  pointer-events: none;
}


.dzb h1, .dzb h2, .dzb h3, .dzb h4 {
  font-family: "Comfortaa", "Nunito", system-ui, sans-serif;
  font-weight: 700;
  line-height: 1.24;
  letter-spacing: -.015em;
  margin: 0 0 .6em;
  text-wrap: balance;
}
.dzb h1 { font-size: clamp(1.8rem, 1.3rem + 2.3vw, 2.9rem); }
.dzb h2 { font-size: clamp(1.45rem, 1.1rem + 1.7vw, 2.25rem); }
.dzb h3 { font-size: clamp(1.2rem, 1rem + 1.1vw, 1.6rem); }
.dzb h4 { font-size: clamp(1.05rem, .98rem + .5vw, 1.25rem); }

.dzb p { margin: 0 0 1.1em; text-wrap: pretty; }
.dzb p:last-child { margin-bottom: 0; }

.dzb .lead {
  font-size: clamp(1.08rem, 1rem + .55vw, 1.35rem);
  color: var(--ink-soft);
  line-height: 1.6;
}

.dzb .eyebrow {
  display: inline-flex; align-items: center; gap: .5rem;
  font-family: "Comfortaa", sans-serif;
  font-size: .78rem; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--accent-deep);
  margin-bottom: .9rem;
}

.dzb .eyebrow::before {
  content: ""; width: 28px; height: 4px; flex: none; border-radius: var(--r-pill);
  background-image: linear-gradient(90deg, var(--yarn-orange) 0 58%, transparent 58%);
  background-size: 9px 4px;
}


.dzb .stitched-title {
  background-image: linear-gradient(90deg, var(--yarn-orange) 0 58%, transparent 58%);
  background-size: 15px 4px;
  background-repeat: repeat-x;
  background-position: 0 100%;
  padding-bottom: .16em;
  -webkit-box-decoration-break: clone;
          box-decoration-break: clone;
}

.dzb .prose > * + * { margin-top: 1.1em; }
.dzb .prose { max-width: var(--maxw-text); }
.dzb .prose strong { color: var(--ink); }


.dzb .knit-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .85rem; }
.dzb .knit-list > li { position: relative; padding-left: 2.1rem; }
.dzb .knit-list > li::before {
  content: "";
  position: absolute; left: 0; top: .5em;
  width: 1.15rem; height: .9rem;
  background: url("https://undemorbe.github.io/dirigible_community/assets/img/knit-stockinette.svg") no-repeat 0 0 / 1.4rem 1.05rem;
  filter: sepia(1) saturate(4) hue-rotate(-15deg);
  opacity: .9;
}


.dzb .container {
  width: 100%;
  max-width: var(--maxw);
  margin-inline: auto;
  padding-inline: var(--pad-x);
}
.dzb .container--narrow { max-width: 820px; }

.dzb .section { padding-block: var(--section-y); }
.dzb .section--tight { padding-block: clamp(2rem, 6vw, 3.5rem); }

.dzb .section--tight + .section--tight { padding-top: 0; }


.dzb .section--purl {
  background-color: var(--wool-200);
  background-image: url("https://undemorbe.github.io/dirigible_community/assets/img/knit-seed.svg");
  background-size: 30px 30px;
  border-block: 3px solid color-mix(in srgb, var(--wool-400) 60%, transparent);
}
.dzb .section--wool {
  background-color: var(--wool-100);
  background-image: url("https://undemorbe.github.io/dirigible_community/assets/img/knit-stockinette.svg");
  background-size: 44px 33px;
}

.dzb .stack { display: grid; gap: var(--gap); }
.dzb .grid { display: grid; gap: var(--gap); }
.dzb .grid--2 { grid-template-columns: 1fr; }
.dzb .grid--3 { grid-template-columns: 1fr; }
.dzb .grid--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

@media (min-width: 640px) {
  .dzb .grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dzb .grid--3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 960px) {
  .dzb .grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dzb .grid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

.dzb .section-head { max-width: var(--maxw-text); margin-bottom: clamp(1.5rem, 4vw, 2.5rem); }
.dzb .section-head--center { margin-inline: auto; text-align: center; }


.dzb .header {
  position: sticky; top: 0; z-index: 100;
  /* Без backdrop-filter/filter/transform: любое из них создаёт containing block
     и выдвижная панель .nav (position: fixed) начинает позиционироваться
     относительно шапки, а не вьюпорта. */
  background-color: var(--wool-50);
  border-bottom: 3px solid var(--wool-300);
}
.dzb .header::after {
  /* нижняя кромка-резинка */
  content: ""; display: block; height: 6px;
  background-image:
    repeating-linear-gradient(90deg,
      var(--yarn-blue) 0 14px, var(--yarn-orange) 14px 28px);
  opacity: .55;
}

.dzb .header__inner {
  display: flex; align-items: center; gap: 1rem;
  min-height: var(--header-h);
  padding-block: .6rem;
}

.dzb .brand { display: flex; align-items: center; gap: .7rem; text-decoration: none; color: var(--ink); margin-right: auto; }
.dzb .brand:hover { color: var(--ink); }
.dzb .brand__mark {
  width: 44px; height: 44px; flex: none;
  border-radius: var(--r-pill);
  background: var(--wool-100);
  border: 2px solid var(--wool-300);
  padding: 3px;
  object-fit: contain;
}
.dzb .brand__text { display: grid; line-height: 1.12; }
.dzb .brand__name { font-family: "Comfortaa", sans-serif; font-weight: 700; font-size: 1.05rem; }
.dzb .brand__sub { font-size: .68rem; color: var(--ink-mute); letter-spacing: .04em; }


.dzb .nav-toggle {
  --bar: var(--ink);
  display: inline-grid; place-content: center; gap: 5px;
  width: 46px; height: 46px; flex: none;
  /* выше выдвижной панели (.nav, z-index: 99), иначе кнопка «закрыть» под ней */
  position: relative; z-index: 101;
  border: 2px solid var(--wool-300);
  border-radius: var(--r-md);
  background: var(--wool-100);
  box-shadow: var(--shadow-1);
}
.dzb .nav-toggle span { display: block; width: 22px; height: 3px; border-radius: 3px; background: var(--bar); transition: transform .28s var(--ease), opacity .2s; }
.dzb .nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
.dzb .nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.dzb .nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }


.dzb .nav {
  position: fixed; inset: 0 0 0 auto;
  width: min(88vw, 340px);
  transform: translateX(101%);
  transition: transform .32s var(--ease);
  background-color: var(--wool-100);
  background-image: url("https://undemorbe.github.io/dirigible_community/assets/img/knit-stockinette.svg");
  background-size: 44px 33px;
  border-left: 4px solid var(--wool-300);
  box-shadow: -24px 0 48px -28px color-mix(in srgb, var(--ink) 60%, transparent);
  padding: calc(var(--header-h) + 1.5rem) 1.5rem 2rem;
  overflow-y: auto;
  z-index: 99;
}
.dzb .nav.is-open { transform: translateX(0); }

.dzb .nav__list { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
.dzb .nav__link {
  display: flex; align-items: center; gap: .6rem;
  white-space: nowrap;
  padding: .8rem 1rem;
  border-radius: var(--r-md);
  font-weight: 700; text-decoration: none; color: var(--ink);
  border: 2px solid transparent;
  transition: background-color .2s, border-color .2s, transform .2s var(--ease);
}
.dzb .nav__link:hover { background: var(--wool-200); color: var(--ink); transform: translateX(3px); }
.dzb .nav__link[aria-current="page"] {
  background: var(--wool-50);
  border-color: var(--yarn-orange);
  border-style: dashed;
  color: var(--accent-deep);
}

.dzb .nav__cta { margin-top: 1.25rem; }

.dzb .nav-backdrop {
  position: fixed; inset: 0; z-index: 98;
  background: color-mix(in srgb, var(--ink) 45%, transparent);
  opacity: 0; visibility: hidden;
  transition: opacity .3s, visibility .3s;
}
.dzb .nav-backdrop.is-open { opacity: 1; visibility: visible; }


@media (min-width: 1080px) {
  .dzb .nav-toggle { display: none; }
  .dzb .nav-backdrop { display: none; }
  .dzb .nav {
    position: static; width: auto; transform: none;
    background: none; border: 0; box-shadow: none; padding: 0; overflow: visible;
  }
  .dzb .nav__list { grid-auto-flow: column; gap: .15rem; align-items: center; }
  .dzb .nav__link { padding: .55rem .8rem; font-size: .95rem; }
  .dzb .nav__link:hover { transform: none; }
  .dzb .nav__cta { margin: 0 0 0 .6rem; }
}


.dzb .btn {
  --btn-bg: var(--yarn-blue);
  --btn-fg: #fff;
  display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
  min-height: 48px;
  padding: .8rem 1.5rem;
  border: 0; border-radius: var(--r-pill);
  background: var(--btn-bg); color: var(--btn-fg);
  font-family: "Comfortaa", sans-serif; font-weight: 700; font-size: 1rem;
  text-align: center; text-decoration: none;
  box-shadow:
    inset 0 0 0 2px color-mix(in srgb, #fff 55%, transparent),
    var(--shadow-1);
  position: relative;
  transition: transform .18s var(--ease), box-shadow .18s var(--ease), background-color .18s;
}

.dzb .btn::after {
  content: ""; position: absolute; inset: 5px;
  border: 2px dashed color-mix(in srgb, #fff 65%, transparent);
  border-radius: var(--r-pill);
  pointer-events: none;
}
.dzb .btn:hover { color: var(--btn-fg); transform: translateY(-2px); box-shadow: inset 0 0 0 2px color-mix(in srgb,#fff 55%,transparent), var(--shadow-2); }
.dzb .btn:active { transform: translateY(1px); }

.dzb .btn--orange { --btn-bg: var(--yarn-orange); }
.dzb .btn--berry { --btn-bg: var(--yarn-berry); }
.dzb .btn--sage { --btn-bg: var(--yarn-sage); }
.dzb .btn--ghost {
  --btn-bg: transparent; --btn-fg: var(--ink);
  box-shadow: inset 0 0 0 2.5px var(--thread-strong), var(--shadow-1);
  background: var(--wool-50);
}
.dzb .btn--ghost::after { border-color: color-mix(in srgb, var(--ink) 22%, transparent); }
.dzb .btn--ghost:hover { background: var(--wool-100); }
.dzb .btn--lg { min-height: 58px; padding: 1rem 2.1rem; font-size: 1.1rem; }
.dzb .btn--block { width: 100%; }


.dzb .doc-link {
  display: flex; align-items: center; gap: .85rem;
  padding: .95rem 1.15rem;
  background: var(--wool-50);
  border: 2px dashed var(--thread);
  border-radius: var(--r-md);
  text-decoration: none; color: var(--ink);
  font-weight: 600; line-height: 1.35;
  transition: border-color .2s, background-color .2s, transform .2s var(--ease);
}
.dzb .doc-link:hover { border-color: var(--yarn-orange); background: var(--wool-100); color: var(--ink); transform: translateY(-2px); }
.dzb .doc-link__icon {
  flex: none; width: 38px; height: 38px;
  display: grid; place-content: center;
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--yarn-mustard) 30%, var(--wool-100));
  color: var(--ink);
}
.dzb .doc-link__meta { display: block; font-size: .78rem; font-weight: 700; color: var(--ink-mute); letter-spacing: .06em; text-transform: uppercase; }


.dzb .card {
  display: flex; flex-direction: column; gap: .85rem;
  padding: clamp(1.25rem, 3.5vw, 1.9rem);
  background-color: var(--wool-50);
  background-image: url("https://undemorbe.github.io/dirigible_community/assets/img/knit-stockinette.svg");
  background-size: 44px 33px;
  border: 3px solid var(--wool-200);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s;
}
.dzb .card--link { text-decoration: none; color: inherit; }
.dzb .card--link:hover { color: inherit; transform: translateY(-4px) rotate(-.4deg); box-shadow: var(--shadow-lift); border-color: var(--yarn-orange); }

.dzb .card__title { margin: 0; font-size: clamp(1.12rem, 1rem + .6vw, 1.4rem); line-height: 1.3; }
.dzb .card__text { color: var(--ink-soft); margin: 0; }


.dzb .card--patch { position: relative; padding-top: calc(clamp(1.25rem,3.5vw,1.9rem) + 8px); }
.dzb .card--patch::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 8px;
  background-image: repeating-linear-gradient(90deg, var(--patch, var(--yarn-blue)) 0 10px, transparent 10px 16px);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}
.dzb .card--patch:nth-child(3n+2) { --patch: var(--yarn-orange); }
.dzb .card--patch:nth-child(3n+3) { --patch: var(--yarn-sage); }

.dzb .card__num {
  width: 46px; height: 46px; flex: none;
  display: grid; place-content: center;
  border-radius: var(--r-pill);

/* --- защита цвета от темы конструктора ---
   Тема Craftum красит ссылки своим акцентом, и правило может стоять
   с !important. Важность бьёт специфичность, поэтому без ответного
   !important наши цвета проигрывают при любом селекторе.

   Список намеренно короткий — только места, где цвет задаёт knit.css,
   а не наследование. Пробовали ставить !important всем свойствам
   подряд: сокращённая запись начинала бить длинную, и пропадали
   обводка активного пункта меню (border против border-color)
   и пунктирный стежок на светлых кнопках (.btn::after против
   .btn--ghost::after). */
.dzb a.btn, .dzb a.btn:hover, .dzb a.btn:focus, .dzb a.btn:visited {
  color: var(--btn-fg) !important;
  text-decoration: none !important;
}
.dzb .nav__link, .dzb .nav__link:visited { color: var(--ink) !important; }
.dzb .nav__link[aria-current="page"] { color: var(--accent-deep) !important; }
.dzb .brand, .dzb .brand:visited, .dzb .brand__name, .dzb .brand__sub {
  color: var(--ink) !important;
}
.dzb .footer__list a, .dzb .footer__list a:visited { color: var(--ink) !important; }
.dzb .footer__list a:hover { color: var(--accent-deep) !important; }

/* --- поправки на то, что .dzb это блок, а не <body> --- */
.dzb {
  /* у body было min-height: 100svh — на блоке это растянуло бы каждый
     кусок страницы на целый экран, а шапку особенно */
  min-height: 0;
  /* body прятал горизонтальное переполнение через overflow-x: hidden.
     На блоке это делает его скролл-контейнером, и position: fixed/sticky
     внутри начинает вести себя иначе. clip обрезает так же, но
     скролл-контейнер не создаёт. */
  overflow-x: clip;
  /* Конструктор центрирует содержимое своих блоков. Наследование
     пробивало сброс насквозь (там text-align: inherit), и по центру
     уезжали тексты карточек, ссылки на документы и опросники.
     Заземляем выравнивание на самом блоке — дальше внутри всё
     наследуется уже от него, а .text-center работает как и работал. */
  text-align: left;
  /* сюда же: чужие отступы и выравнивание блока целиком */
  padding: 0;

  /* Блок лежит внутри контейнера конструктора, у которого свои поля по
     бокам, — полотно не доходило до краёв экрана. Растягиваем блок на
     всю ширину окна: отрицательный отступ считается от собственной
     ширины, поэтому приём безвреден и там, где полей нет (тогда
     50% - 50vw даёт ноль). Боковые поля самого содержимого никуда
     не деваются — их держит .container. */
  width: var(--dzb-vw, 100vw);
  max-width: var(--dzb-vw, 100vw);
  /* литеральный процент в %-строке пишется как %% */
  margin-inline: calc(50% - var(--dzb-vw, 100vw) / 2);
  margin-block: 0;
}

/* Блок не рисует полотно сам.
   Декор лежит на z-index: -1 — клубки (.pompom) и подложка героя
   с градиентами (.hero::before). На сайте они уходят за фон <body>,
   который рисуется на канвасе и ничего не перекрывает. Стоит дать
   блоку собственный фон — и декор прячется под ним: пропадали
   и клубки, и цветные ореолы в шапке страницы.
   Поэтому полотно отдано самой странице (см. body:has(.dzb) ниже),
   а блок прозрачный. Секции со своим фоном — жемчужные и шерстяные —
   не затронуты, у них фон задан явно. */
.dzb {
  background-color: transparent;
  background-image: none;
}

/* Фестоны на стыке с подвалом рисует сама секция
   (.scallop-bottom::after свисает на 13px ниже её края). Своей
   заменой этот псевдоэлемент не подменяем: повторить его точно не
   вышло — над полукружиями проступала нижняя рамка секции, а сами
   они выходили мельче. Вместо этого убираем то, что их перекрывало:
   у блока подвала нет собственного фона, полотно под просветом даёт
   страница. */

/* Подвал отбивается от контента внешним отступом — на сайте в этом
   просвете видно полотно и фестоны последней секции. Отдельным блоком
   тот же отступ показывал белый фон страницы конструктора. Поэтому
   отступ делаем внутренним, а блоку даём то же полотно, что и у body:
   просвет остаётся, но он наш. */
.dzb.dzb-chrome--footer {
  margin-top: 0;
  padding-top: clamp(2rem, 6vw, 4rem);
}
.dzb.dzb-chrome--footer .footer { margin-top: 0; }

/* Шапка.
   position: sticky здесь не годится: липкий элемент держится в пределах
   своего родителя, а конструктор заворачивает блок «HTML-код» в свой
   контейнер высотой ровно с шапку — прилипать некуда, она уезжает вверх
   вместе с ним. Поэтому fixed, а место под неё освобождает скрипт
   сквозного кода: он измеряет высоту и ставит body padding-top. */
.dzb.dzb-chrome--header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  overflow: visible;
}
.dzb.dzb-chrome--header .header { position: static; }

/* Высота шапки известна заранее (--header-h), поэтому отступ под неё
   задаём сразу стилями. Скрипт потом уточнит его по факту, но контент
   уже не прыгает на величину шапки при загрузке.

   Заодно страница получает наше полотно: блоки не стыкуются вплотную
   (отступы конструктора, просвет под шапкой), и в щелях просвечивал
   белый фон — от этого весь сайт выглядел выцветшим. */
/* без > : конструктор заворачивает блоки в свои контейнеры */
body:has(.dzb) {
  margin: 0;
  background-color: var(--wool-50, #FBF6EC);
  background-image: url("https://undemorbe.github.io/dirigible_community/assets/img/knit-stockinette.svg");
  background-size: 44px 33px;
}
body:has(.dzb.dzb-chrome--header) { padding-top: 80px; }

/* Плавное появление.
   Блоки конструктор вставляет не одновременно: шапка, содержимое и
   подвал встают по очереди, плюс дорисовка шрифтов. Без этого страница
   на глазах дёргается. Показываем её одним движением, когда разметка
   на месте — класс ставит скрипт.

   Именно transition, а не animation с forwards: анимация в режиме
   заливки держит элемент в собственном контексте наложения навсегда,
   и фон блока-подвала начинал перекрывать фестоны соседнего блока,
   которые выступают за его нижний край. У перехода по завершении
   остаются opacity: 1 и transform: none — контекст исчезает. */
.dzb-js .dzb {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .45s var(--ease), transform .45s var(--ease);
}
/* Шапку не сдвигаем: она fixed, трансформация создала бы containing
   block и выдвижная панель .nav (position: fixed) схлопнулась бы
   под шапку — грабли, на которые уже наступали в knit.css. */
.dzb-js .dzb.dzb-chrome--header { transform: none; }
.dzb-js .dzb.dzb-shown { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .dzb-js .dzb { transition-duration: .001ms; transform: none; }
}

/* --- лейбл платформы под подвалом ---
   Конструктор дорисовывает свою подпись «Конструктор сайтов Craftum»
   после всех блоков. Разметки её в выгрузке нет, поэтому скрипт находит
   её по ссылке на craftum.com и вешает класс. Убирать подпись нечем —
   это условие тарифа; приводим к виду сайта, чтобы не выбивалась.

   Цвета заданы литералами: токены шерсти и чернил объявлены на самих
   блоках, а подпись лежит вне них и ничего не наследует. */
.dzb-platform {
  background-color: #F4EADA !important;
  background-image: url("https://undemorbe.github.io/dirigible_community/assets/img/knit-seed.svg") !important;
  background-size: 26px 26px !important;
  border-top: 2px dashed rgba(51, 41, 31, .22) !important;
  color: #927E67 !important;
  font-family: "Nunito", "Segoe UI", system-ui, sans-serif !important;
  font-size: .875rem !important;
  text-align: center !important;
  padding: 1rem !important;
}
.dzb-platform a {
  color: #146189 !important;
  text-underline-offset: .22em;
}
.dzb-platform img, .dzb-platform svg { opacity: .75; }

<script>
/* Поведенческий слой сайта. Запускается один раз на страницу, даже если
   сквозной код по недосмотру окажется вставлен дважды. */
(function () {
  "use strict";
  if (window.__dirigibleBooted) { return; }
  window.__dirigibleBooted = true;

/* АНО «Дирижабль» — общий поведенческий слой сайта.
   Без зависимостей. Всё опционально: если блока нет на странице, модуль молчит. */
(function () {
  'use strict';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ------------------------------------------------------- мобильное меню */
  function initNav() {
    var toggle = document.querySelector('[data-nav-toggle]');
    var nav = document.getElementById('site-nav');
    var backdrop = document.querySelector('[data-nav-backdrop]');
    if (!toggle || !nav) return;

    var lastFocused = null;

    function open() {
      lastFocused = document.activeElement;
      nav.classList.add('is-open');
      if (backdrop) backdrop.classList.add('is-open');
      toggle.setAttribute('aria-expanded', 'true');
      document.body.classList.add('is-locked');
      var first = nav.querySelector('a, button');
      if (first) first.focus({ preventScroll: true });
    }

    function close() {
      nav.classList.remove('is-open');
      if (backdrop) backdrop.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('is-locked');
      if (lastFocused && document.contains(lastFocused)) lastFocused.focus({ preventScroll: true });
    }

    toggle.addEventListener('click', function () {
      if (toggle.getAttribute('aria-expanded') === 'true') close(); else open();
    });

    if (backdrop) backdrop.addEventListener('click', close);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') close();
    });

    // удержание фокуса внутри панели, пока она открыта
    nav.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' || toggle.getAttribute('aria-expanded') !== 'true') return;
      var items = nav.querySelectorAll('a[href], button:not([disabled])');
      if (!items.length) return;
      var first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); toggle.focus(); }
    });

    // переход в десктопный режим — сбрасываем состояние
    // держать в паре с брейкпоинтом меню в knit.css
    var desktop = window.matchMedia('(min-width: 1080px)');
    var onChange = function (e) { if (e.matches) close(); };
    if (desktop.addEventListener) desktop.addEventListener('change', onChange);
    else if (desktop.addListener) desktop.addListener(onChange);
  }

  /* ------------------------------------------------------------- карусели */
  function initCarousels(root) {
    var list = (root || document).querySelectorAll('[data-carousel]');
    Array.prototype.forEach.call(list, function (carousel) {
      var track = carousel.querySelector('[data-carousel-track]');
      if (!track) return;
      var prev = carousel.querySelector('[data-carousel-prev]');
      var next = carousel.querySelector('[data-carousel-next]');
      var dotsBox = carousel.querySelector('[data-carousel-dots]');
      var slides = Array.prototype.slice.call(track.children);
      if (slides.length < 2) {
        var nav = carousel.querySelector('.carousel__nav');
        if (nav) nav.hidden = true;
        return;
      }

      var dots = [];
      if (dotsBox) {
        slides.forEach(function (slide, i) {
          var dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'carousel__dot';
          dot.setAttribute('aria-label', 'Слайд ' + (i + 1) + ' из ' + slides.length);
          dot.addEventListener('click', function () { scrollToIndex(i); });
          dotsBox.appendChild(dot);
          dots.push(dot);
        });
      }

      // Позиция слайда считается через getBoundingClientRect относительно трека:
      // offsetLeft отсчитывается от offsetParent, которым трек не является,
      // и даёт неверные координаты.
      function slideOffset(s) {
        return s.getBoundingClientRect().left - track.getBoundingClientRect().left + track.scrollLeft;
      }

      function currentIndex() {
        var center = track.scrollLeft + track.clientWidth / 2;
        var best = 0, bestDist = Infinity;
        slides.forEach(function (s, i) {
          var d = Math.abs(slideOffset(s) + s.offsetWidth / 2 - center);
          if (d < bestDist) { bestDist = d; best = i; }
        });
        return best;
      }

      function scrollToIndex(i) {
        var s = slides[Math.max(0, Math.min(slides.length - 1, i))];
        track.scrollTo({
          left: slideOffset(s) - (track.clientWidth - s.offsetWidth) / 2,
          behavior: reduceMotion ? 'auto' : 'smooth'
        });
      }

      function sync() {
        var i = currentIndex();
        dots.forEach(function (d, di) { d.setAttribute('aria-current', di === i ? 'true' : 'false'); });
        if (prev) prev.disabled = track.scrollLeft <= 2;
        if (next) next.disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
      }

      if (prev) prev.addEventListener('click', function () { scrollToIndex(currentIndex() - 1); });
      if (next) next.addEventListener('click', function () { scrollToIndex(currentIndex() + 1); });

      var ticking = false;
      track.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(function () { sync(); ticking = false; });
      }, { passive: true });

      window.addEventListener('resize', sync, { passive: true });
      sync();
    });
  }

  /* ------------------------------------------------- появление при скролле */
  function initReveal(root) {
    var items = (root || document).querySelectorAll('.reveal');
    if (!items.length) return;
    if (reduceMotion || !('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(items, function (el) { el.classList.add('is-visible'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    Array.prototype.forEach.call(items, function (el) { io.observe(el); });

    // Страховка: контент не должен остаться невидимым, если наблюдатель почему-то
    // не сработал (фоновая вкладка, приостановленный рендеринг, ошибка в браузере).
    window.setTimeout(function () {
      Array.prototype.forEach.call(items, function (el) {
        if (!el.classList.contains('is-visible')) {
          el.classList.add('is-visible');
          io.unobserve(el);
        }
      });
    }, 3000);
  }

  /* --------------------------- виджет пожертвований: запасной вариант */
  function initDonateFallback() {
    var box = document.querySelector('[data-donate-widget]');
    var fallback = document.querySelector('[data-donate-fallback]');
    if (!box || !fallback) return;

    var mount = box.querySelector('mixplat-form');
    var loading = box.querySelector('[data-donate-loading]');

    // Точки монтирования нет — идентификаторы не заданы при сборке.
    // Запасной блок уже показан разметкой, ждать нечего.
    if (!mount) return;

    function rendered() {
      // Виджет дорисовывает содержимое внутрь <mixplat-form>.
      return mount.children.length > 0 || mount.shadowRoot ||
             box.querySelector('iframe, form');
    }

    // Тема виджета: свои стили внутрь shadow DOM. Обычный CSS страницы
    // сквозь границу shadow DOM не проходит, а вот <link> внутри shadowRoot
    // работает. CSS-переменные сайта наследуются туда сами.
    function applyTheme() {
      var href = box.getAttribute('data-donate-style');
      var root = mount.shadowRoot;
      if (!href || !root || root.querySelector('link[data-donate-theme]')) return;
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = href;
      link.setAttribute('data-donate-theme', '');
      root.appendChild(link);
    }

    function settle() {
      if (loading) loading.hidden = true;
      box.setAttribute('data-state', 'ready');
      applyTheme();
    }

    // Виджет donation.ru внешний: если он не отрисовался за 6 с
    // (нет сети, блокировщик, офлайн-просмотр) — показываем реквизиты.
    var waited = 0;
    var timer = window.setInterval(function () {
      waited += 400;
      if (rendered()) {
        window.clearInterval(timer);
        settle();
      } else if (waited >= 6000) {
        window.clearInterval(timer);
        if (loading) loading.hidden = true;
        fallback.hidden = false;
        box.setAttribute('data-state', 'fallback');
      }
    }, 400);
  }

  /* ------------------------------------------------------------- видео */
  /* Плеер RuTube подставляется только по клику: до этого не грузим сторонний
     iframe и его куки, а страница остаётся лёгкой. Постер виден и без JS. */
  function initVideo(root) {
    var boxes = (root || document).querySelectorAll('[data-video]');
    Array.prototype.forEach.call(boxes, function (box) {
      var btn = box.querySelector('[data-video-play]');
      var src = box.getAttribute('data-video-src');
      if (!btn || !src || box.getAttribute('data-state') === 'playing') return;

      btn.addEventListener('click', function () {
        var frame = document.createElement('iframe');
        frame.src = src;
        frame.title = btn.getAttribute('aria-label') || 'Видео';
        frame.allow = 'autoplay; fullscreen; picture-in-picture';
        frame.setAttribute('allowfullscreen', '');
        frame.loading = 'lazy';

        var poster = box.querySelector('.video__poster');
        if (poster) poster.remove();
        box.appendChild(frame);
        box.setAttribute('data-state', 'playing');
        frame.focus({ preventScroll: true });
      });
    });
  }

  /* ----------------------------------------- активный пункт навигации */
  function markCurrentNav() {
    var here = location.pathname.split('/').pop() || 'index.html';
    var links = document.querySelectorAll('.nav__link, .footer__list a');
    Array.prototype.forEach.call(links, function (a) {
      var href = (a.getAttribute('href') || '').split('/').pop().split('#')[0];
      if (href && href === here) a.setAttribute('aria-current', 'page');
    });
  }

  /* ------------------------------------------------------------- запуск */
  function boot() {
    initNav();
    initCarousels();
    initReveal();
    initDonateFallback();
    initVideo();
    markCurrentNav();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  // Публичное API — используется articles.js для доинициализации новых карточек.
  window.Dirigible = { initCarousels: initCarousels, initReveal: initReveal,
                      initVideo: initVideo, reduceMotion: reduceMotion };
})();


/* Лента материалов АНО «Дирижабль».
 *
 * Заменяет исходный articles.js из Craftum, который ходил в закрытый
 * бэкенд `/user-website-api/blog/rubrics/<id>/articles/` и в статической
 * выгрузке всегда падал с 404, оставляя пустой список.
 *
 * Источник данных теперь локальный: assets/data/articles.json.
 * Если fetch недоступен (открытие по file://), берём копию данных из
 * инлайнового <script type="application/json" id="articles-data">.
 */
(function () {
  'use strict';

  var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
                'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

  function formatDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function readInline() {
    var node = document.getElementById('articles-data');
    if (!node) return null;
    try { return JSON.parse(node.textContent); }
    catch (e) { return null; }
  }

  function load(endpoint) {
    var inline = readInline();
    if (!window.fetch || location.protocol === 'file:') {
      return inline ? Promise.resolve(inline)
                    : Promise.reject(new Error('нет fetch и нет инлайновых данных'));
    }
    return fetch(endpoint, { headers: { Accept: 'application/json' } })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .catch(function (err) {
        if (inline) return inline;
        throw err;
      });
  }

  function Feed(root) {
    this.root = root;
    this.endpoint = root.dataset.articlesEndpoint || 'assets/data/articles.json';
    // Пути к картинкам и страницам внутри articles.json относительные.
    // На сайте они разрешаются сами, а в сборке для Craftum лента живёт
    // на чужом домене — там база задаётся через data-articles-base.
    this.base = root.dataset.articlesBase || '';
    // Картинки и страницы там лежат по разным адресам: файлы — в нашем
    // хранилище, страницы — на самом домене и под своими адресами.
    // data-articles-links отдаёт карту «имя файла → адрес страницы».
    try {
      this.links = JSON.parse(root.dataset.articlesLinks || '{}');
    } catch (e) {
      this.links = {};
    }
    this.perPage = parseInt(root.dataset.articlesPerPage, 10) || 6;
    this.rubric = root.dataset.articlesRubric || '';
    this.listEl = root.querySelector('[data-articles-list]');
    this.tagsEl = root.querySelector('[data-articles-tags]');
    this.moreEl = root.querySelector('[data-articles-more]');
    this.statusEl = root.querySelector('[data-articles-status]');
    this.all = [];
    this.tags = [];
    this.activeTag = '';
    this.shown = 0;
  }

  Feed.prototype.status = function (message, isError) {
    if (!this.statusEl) return;
    if (!message) { this.statusEl.hidden = true; this.statusEl.textContent = ''; return; }
    this.statusEl.hidden = false;
    this.statusEl.textContent = message;
    this.statusEl.setAttribute('role', isError ? 'alert' : 'status');
  };

  Feed.prototype.filtered = function () {
    var tag = this.activeTag;
    if (!tag) return this.all;
    return this.all.filter(function (a) { return (a.tags || []).indexOf(tag) !== -1; });
  };

  Feed.prototype.renderTags = function () {
    if (!this.tagsEl) return;
    this.tagsEl.innerHTML = '';
    var self = this;
    var options = [{ id: '', name: 'Все' }].concat(this.tags);

    options.forEach(function (tag) {
      var btn = el('button', 'tag', tag.name);
      btn.type = 'button';
      btn.setAttribute('aria-pressed', String(tag.id === self.activeTag));
      btn.addEventListener('click', function () {
        if (self.activeTag === tag.id) return;
        self.activeTag = tag.id;
        self.shown = 0;
        self.listEl.innerHTML = '';
        self.renderTags();
        self.renderPage();
      });
      self.tagsEl.appendChild(btn);
    });
  };

  // Относительный путь из articles.json + база ленты. Абсолютные адреса,
  // якоря, mailto: и tel: остаются как есть.
  Feed.prototype.resolve = function (path) {
    if (!path) return path;
    if (/^(https?:|\/\/|data:|#|mailto:|tel:)/i.test(path)) return path;
    var cut = path.indexOf('#');
    var file = cut < 0 ? path : path.slice(0, cut);
    var hash = cut < 0 ? '' : path.slice(cut);
    if (this.links[file]) return this.links[file] + hash;
    if (!this.base) return path;
    return this.base + path.replace(/^\//, '');
  };

  Feed.prototype.card = function (article) {
    var isExternal = /^https?:/i.test(article.url || '');
    var node = el(article.url ? 'a' : 'article', 'card article-card' + (article.url ? ' card--link' : '') + ' reveal');

    if (article.url) {
      node.href = this.resolve(article.url);
      if (isExternal) { node.target = '_blank'; node.rel = 'noopener noreferrer'; }
    }

    if (article.image) {
      var img = el('img', 'article-card__media');
      img.src = this.resolve(article.image);
      img.alt = article.imageAlt || '';
      img.loading = 'lazy';
      img.decoding = 'async';
      if (article.imageWidth) img.width = article.imageWidth;
      if (article.imageHeight) img.height = article.imageHeight;
      node.appendChild(img);
    }

    var body = el('div', 'article-card__body');
    // dateText — человекочитаемая подпись, когда точная дата в источнике не указана
    var when = article.dateText || (article.date ? formatDate(article.date) : '');
    if (when) body.appendChild(el('span', 'article-card__date', when));
    body.appendChild(el('h3', 'article-card__title', article.title || 'Без названия'));
    if (article.excerpt) body.appendChild(el('p', 'article-card__text', article.excerpt));

    if ((article.tags || []).length) {
      var wrap = el('div', 'article-card__tags');
      var names = this.tagNames;
      article.tags.forEach(function (id) {
        wrap.appendChild(el('span', 'chip', names[id] || id));
      });
      body.appendChild(wrap);
    }

    if (isExternal) {
      var hint = el('span', 'visually-hidden', '(откроется в новой вкладке)');
      body.appendChild(hint);
    }

    node.appendChild(body);
    return node;
  };

  Feed.prototype.renderPage = function () {
    var items = this.filtered();

    if (!items.length) {
      this.status('По этому фильтру материалов пока нет. Выберите другой раздел.');
      if (this.moreEl) this.moreEl.hidden = true;
      return;
    }
    this.status('');

    var slice = items.slice(this.shown, this.shown + this.perPage);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < slice.length; i++) frag.appendChild(this.card(slice[i]));
    this.listEl.appendChild(frag);
    this.shown += slice.length;

    if (this.moreEl) {
      var left = items.length - this.shown;
      this.moreEl.hidden = left <= 0;
      this.moreEl.textContent = left > 0 ? 'Показать ещё (' + left + ')' : 'Показать ещё';
    }

    if (window.Dirigible) window.Dirigible.initReveal(this.listEl);
  };

  Feed.prototype.init = function () {
    var self = this;
    if (!this.listEl) return;

    this.status('Загружаем материалы…');

    load(this.endpoint).then(function (data) {
      var articles = (data && data.articles) || [];
      var tags = (data && data.tags) || [];

      self.tagNames = {};
      tags.forEach(function (t) { self.tagNames[t.id] = t.name; });

      if (self.rubric) {
        var allowed = self.rubric.split(/\s*,\s*/).filter(Boolean);
        articles = articles.filter(function (a) {
          return (a.tags || []).some(function (t) { return allowed.indexOf(t) !== -1; });
        });
      }

      // сортировка по дате; материалы без даты уходят в конец, сохраняя исходный порядок
      articles.sort(function (a, b) {
        var ta = a.date ? new Date(a.date).getTime() : -Infinity;
        var tb = b.date ? new Date(b.date).getTime() : -Infinity;
        return tb - ta;
      });
      self.all = articles;

      // показываем только те теги, которые реально встречаются
      var used = {};
      articles.forEach(function (a) { (a.tags || []).forEach(function (t) { used[t] = true; }); });
      self.tags = tags.filter(function (t) { return used[t.id]; });

      self.renderTags();
      self.renderPage();
    }).catch(function (err) {
      self.status('Не удалось загрузить ленту материалов: ' + err.message +
                  '. Обновите страницу или откройте сайт через локальный сервер.', true);
      if (self.moreEl) self.moreEl.hidden = true;
      if (window.console) console.error('[articles]', err);
    });

    if (this.moreEl) {
      this.moreEl.addEventListener('click', function () { self.renderPage(); });
    }
  };

  function boot() {
    var roots = document.querySelectorAll('[data-articles]');
    Array.prototype.forEach.call(roots, function (root) {
      // Повторный запуск возможен: в сборке для Craftum сквозной код
      // выполняется раньше, чем на странице появляется блок с лентой,
      // поэтому boot() зовут ещё раз. Второй Feed на том же контейнере
      // продублировал бы карточки.
      if (root.getAttribute('data-articles-ready') === '1') return;
      root.setAttribute('data-articles-ready', '1');
      new Feed(root).init();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  // Публичное API — как window.Dirigible у app.js: позволяет запустить
  // ленту для разметки, появившейся после загрузки страницы.
  window.DirigibleArticles = { boot: boot };
})();


  /* app.js инициализирует то, что уже есть в документе. Блоки «HTML-код»
     конструктор может дорисовать позже (предпросмотр, ленивые секции),
     поэтому следим за появлением новых .dzb и доинициализируем их.

     Первый проход только помечает блоки: их app.js уже обработал.
     Инициализировать их второй раз нельзя — initCarousels добавил бы
     карусели второй комплект точек. */
  var firstSweep = true;

  function claim(root) {
    if (!root || root.getAttribute("data-dzb-ready") === "1") { return; }
    root.setAttribute("data-dzb-ready", "1");
    var api = window.Dirigible;
    if (firstSweep || !api) { return; }
    api.initCarousels(root);
    api.initReveal(root);
    api.initVideo(root);
  }

  function reveal() {
    Array.prototype.forEach.call(document.querySelectorAll(".dzb"),
      function (el) { el.classList.add("dzb-shown"); });
  }

  function sweep() {
    Array.prototype.forEach.call(document.querySelectorAll(".dzb"), claim);
    firstSweep = false;
    /* Ленту материалов зовём всегда: её boot() отрабатывает раньше, чем
       конструктор вставит блок. Повторов не будет — articles.js помечает
       контейнер флагом data-articles-ready. */
    if (window.DirigibleArticles) { window.DirigibleArticles.boot(); }
  }

  /* Активный пункт меню.
     markCurrentNav() из app.js сравнивает последний сегмент пути, и на
     главной это не работает: её адрес заканчивается слешем, а в ссылке
     стоит полный URL. Сравниваем нормализованные пути целиком. */
  function norm(href) {
    try {
      var p = new URL(href, location.href);
      if (p.host !== location.host) { return null; }
      return p.pathname.replace(/\/index\.html$/, "/").replace(/\/+$/, "/");
    } catch (e) { return null; }
  }

  function markNav() {
    var here = norm(location.href);
    if (!here) { return; }
    var links = document.querySelectorAll(".dzb .nav__link, .dzb .footer__list a");
    Array.prototype.forEach.call(links, function (a) {
      if (norm(a.getAttribute("href")) === here) {
        a.setAttribute("aria-current", "page");
      } else {
        a.removeAttribute("aria-current");
      }
    });
  }

  /* Шапка-блок стоит position: fixed и места в потоке не занимает —
     без компенсации содержимое страницы уехало бы под неё. Высоту
     меряем по факту: она зависит от ширины окна и от шрифта. */
  /* 100vw считается вместе с полосой прокрутки, и растянутый блок
     оказался бы шире страницы — появился бы горизонтальный скролл.
     Поэтому ширину окна отдаём скриптом, уже без полосы. */
  function measureViewport() {
    document.documentElement.style.setProperty(
      "--dzb-vw", document.documentElement.clientWidth + "px");
  }

  function offsetHeader() {
    var header = document.querySelector(".dzb-chrome--header");
    if (!header) { return; }
    var h = Math.round(header.getBoundingClientRect().height);
    if (!h) { return; }
    document.body.style.paddingTop = h + "px";
    /* Переменную --header-h не трогаем: из неё растёт min-height самой
       шапки (.header__inner), и подстановка измеренной высоты даёт
       обратную связь — шапка раздувается до нескольких тысяч пикселей. */
  }

  /* Подпись конструктора под подвалом. Её разметка нам неизвестна —
     в выгрузке сайта её нет, она появляется только на публикации.
     Ищем по ссылке на craftum.com за пределами наших блоков и помечаем
     ближайшего прямого потомка body, чтобы оформить его как часть сайта. */
  function markPlatform() {
    var links = document.querySelectorAll('a[href*="craftum.com"]');
    Array.prototype.forEach.call(links, function (a) {
      if (a.closest(".dzb")) { return; }
      var box = a;
      while (box.parentElement && box.parentElement !== document.body) {
        box = box.parentElement;
      }
      box.classList.add("dzb-platform");
    });
  }

  function watch() {
    sweep();
    markNav();
    markPlatform();
    measureViewport();
    offsetHeader();
    window.addEventListener("resize", function () {
      measureViewport();
      offsetHeader();
    }, { passive: true });
    /* Первый замер случается до того, как применится шрифт и дорисуется
       рамка шапки, — перемеряем после загрузки. */
    window.addEventListener("load", offsetHeader);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(offsetHeader);
    }

    /* Показываем следующим кадром — к этому моменту отступ под шапку
       уже выставлен, и появление идёт без скачка. Страховка на случай,
       если шрифты или наблюдатели почему-то не отработают. */
    window.requestAnimationFrame(reveal);
    window.setTimeout(reveal, 1200);
    if (window.ResizeObserver) {
      var header = document.querySelector(".dzb-chrome--header");
      if (header) { new ResizeObserver(offsetHeader).observe(header); }
    }
    if (!window.MutationObserver) { return; }
    new MutationObserver(function () {
      sweep(); markNav(); markPlatform(); offsetHeader(); reveal();
    })
      .observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", watch);
  } else {
    watch();
  }
})();
</script>
